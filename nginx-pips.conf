server {
    listen 80;
    server_name pips.dvikara.cloud;

    # Static pages — installer & download
    location = / {
        proxy_pass http://127.0.0.1:20129/index.html;
    }

    location = /install {
        proxy_pass http://127.0.0.1:20129/install;
        add_header Content-Type text/plain;
    }

    location = /install.sh {
        proxy_pass http://127.0.0.1:20129/install.sh;
        add_header Content-Type text/plain;
    }

    location = /install.ps1 {
        proxy_pass http://127.0.0.1:20129/install.ps1;
        add_header Content-Type text/plain;
    }

    location = /pips-cli.py {
        proxy_pass http://127.0.0.1:20129/pips-cli.py;
        add_header Content-Disposition 'attachment; filename="pips-cli.py"';
        add_header Content-Type text/plain;
    }

    location = /pips-agent.py {
        proxy_pass http://127.0.0.1:20129/pips-agent.py;
        add_header Content-Disposition 'attachment; filename="pips-agent.py"';
        add_header Content-Type text/plain;
    }

    # PIPS Agent Server & Web Mission Control
    location /agent {
        proxy_pass http://127.0.0.1:20130;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/agent {
        proxy_pass http://127.0.0.1:20130;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # API — 9Router
    location /v1 {
        proxy_pass http://127.0.0.1:20128;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
        chunked_transfer_encoding on;
    }

    location /api {
        proxy_pass http://127.0.0.1:20128;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
